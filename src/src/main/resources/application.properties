spring.application.name=correspondances
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:correspondances}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration,filesystem:../db/seed
spring.flyway.fail-on-missing-locations=true


#display queries logs
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
#display session's stats 
spring.jpa.properties.hibernate.generate_statistics=true

